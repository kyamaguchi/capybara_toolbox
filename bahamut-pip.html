<button id="pip">PiPで表示</button>
<p>再生してからPiPボタンを押してください。iPhoneではSafariの標準PiP操作も利用できます。</p>
</main>
<script>
const v=document.getElementById('v'), b=document.getElementById('pip');
b.onclick=async()=>{
  try{await v.play()}catch(e){}
  try{
    if(v.webkitSupportsPresentationMode&&typeof v.webkitSetPresentationMode==='function'){
      v.webkitSetPresentationMode('picture-in-picture');
    }else if(document.pictureInPictureEnabled&&v.requestPictureInPicture){
      await v.requestPictureInPicture();
    }
  }catch(e){alert('動画の標準PiPボタンを使ってください');}
};
</script>
